services:
  postgres_existing:
    image: postgres:15
    container_name: postgres_existing
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_new:
    image: postgres:15
    container_name: postgres_new
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_new_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - postgres_new
    command: /app/server

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      WEBHOOK_HTTP_BASE_PATH: "http://server:8081/event"
      KC_LOG_LEVEL: com.vymalo.keycloak.webhook:DEBUG,org.keycloak.events:DEBUG
    ports:
      - "8080:8080"
    depends_on:
      - postgres_existing
      - server
    entrypoint:
      - "/opt/keycloak/bin/kc.sh"
    command:
      - "start-dev"
      - "--http-port=8080"
      - "--db=postgres"
      - "--db-url=jdbc:postgresql://postgres_existing:5432/mydb"
      - "--db-username=admin"
      - "--db-password=admin"
    volumes:
      - ./plugins:/opt/keycloak/providers:ro

volumes:
  postgres_data:
  postgres_new_data:
